<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evaluación Vocacional RIASEC</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
    padding:40px 20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:18px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#1d3557;
}

.subtitle{
    text-align:center;
    margin-bottom:40px;
    color:#555;
    line-height:1.5;
}

.question{
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:1px solid #eee;
}

.question h3{
    margin-bottom:15px;
    font-size:18px;
    color:#222;
}

.options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.options label{
    background:#eef3ff;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    border:2px solid transparent;
}

.options label:hover{
    background:#dce7ff;
}

.options input{
    display:none;
}

.options input:checked + span{
    font-weight:bold;
    color:#0d47a1;
}

button{
    width:100%;
    padding:18px;
    border:none;
    background:#1d3557;
    color:white;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    margin-top:30px;
    transition:.3s;
}

button:hover{
    background:#16324f;
}

.results{
    margin-top:50px;
    display:none;
}

.score{
    margin-bottom:18px;
}

.bar{
    height:22px;
    background:#e5e5e5;
    border-radius:12px;
    overflow:hidden;
}

.fill{
    height:100%;
    border-radius:12px;
}

.fill.R{background:#457b9d;}
.fill.I{background:#6a4c93;}
.fill.A{background:#e63946;}
.fill.S{background:#2a9d8f;}
.fill.E{background:#f4a261;}
.fill.C{background:#264653;}

.result-box{
    margin-top:35px;
    background:#f8fbff;
    border-left:6px solid #1d3557;
    padding:25px;
    border-radius:12px;
}

.result-box h2{
    margin-bottom:15px;
}

.careers{
    margin-top:20px;
}

.careers ul{
    margin-left:20px;
    line-height:1.8;
}

@media(max-width:768px){

    .container{
        padding:20px;
    }

    .options{
        flex-direction:column;
    }

}

</style>
</head>
<body>

<div class="container">

    <h1>Evaluación Vocacional RIASEC</h1>

    <p class="subtitle">
        Este cuestionario explora tus intereses, preferencias y tendencias ocupacionales.
        Responde honestamente pensando en cuánto disfrutarías cada actividad.
    </p>

    <form id="vocationalForm"></form>

    <button onclick="calculateResults()">Ver resultados</button>

    <div class="results" id="results"></div>

</div>

<script>

const questions = [

/* REALISTA */
{
text:"Disfruto trabajar con herramientas, equipos o maquinaria.",
type:"R"
},
{
text:"Me gustan las actividades prácticas y manuales.",
type:"R"
},
{
text:"Preferiría reparar objetos antes que diseñarlos.",
type:"R"
},
{
text:"Disfruto trabajar al aire libre.",
type:"R"
},

/* INVESTIGADOR */
{
text:"Me gusta analizar problemas complejos.",
type:"I"
},
{
text:"Disfruto la investigación y la búsqueda de explicaciones.",
type:"I"
},
{
text:"Me interesa la ciencia y el conocimiento.",
type:"I"
},
{
text:"Disfruto aprender teorías nuevas.",
type:"I"
},

/* ARTÍSTICO */
{
text:"Me gusta expresarme creativamente.",
type:"A"
},
{
text:"Disfruto actividades relacionadas con arte, música o escritura.",
type:"A"
},
{
text:"Prefiero ambientes flexibles y creativos.",
type:"A"
},
{
text:"Me gusta crear ideas originales.",
type:"A"
},

/* SOCIAL */
{
text:"Me gusta ayudar a otras personas.",
type:"S"
},
{
text:"Disfruto enseñar o explicar cosas.",
type:"S"
},
{
text:"Me siento cómodo escuchando problemas ajenos.",
type:"S"
},
{
text:"Prefiero trabajos donde interactúe con personas.",
type:"S"
},

/* EMPRENDEDOR */
{
text:"Me gusta liderar grupos.",
type:"E"
},
{
text:"Disfruto convencer o influir en otros.",
type:"E"
},
{
text:"Me interesa emprender proyectos.",
type:"E"
},
{
text:"Me motivan los retos competitivos.",
type:"E"
},

/* CONVENCIONAL */
{
text:"Me gusta organizar información y documentos.",
type:"C"
},
{
text:"Prefiero tareas estructuradas y claras.",
type:"C"
},
{
text:"Me siento cómodo siguiendo procedimientos.",
type:"C"
},
{
text:"Disfruto planificar y ordenar actividades.",
type:"C"
}

];

const descriptions = {

R:"Perfil orientado a la acción práctica, técnica y concreta. Sueles sentirte cómodo resolviendo problemas tangibles y trabajando con objetos, herramientas o sistemas físicos.",

I:"Perfil analítico e intelectual. Tiendes a disfrutar la investigación, la resolución de problemas y el aprendizaje profundo.",

A:"Perfil creativo, expresivo e innovador. Sueles valorar la originalidad, la imaginación y la libertad de expresión.",

S:"Perfil interpersonal y de ayuda. Tiendes a sentir satisfacción colaborando, enseñando o acompañando a otras personas.",

E:"Perfil orientado al liderazgo, emprendimiento e influencia social. Sueles sentir motivación por dirigir proyectos y alcanzar metas.",

C:"Perfil organizado y estructurado. Prefieres ambientes ordenados, planificación y claridad en procesos."
};

const careers = {

R:["Ingeniería", "Mecánica", "Arquitectura técnica", "Electricidad", "Logística"],

I:["Medicina", "Psicología", "Biología", "Investigación", "Data Science"],

A:["Diseño gráfico", "Publicidad", "Música", "Escritura", "Producción audiovisual"],

S:["Psicología", "Docencia", "Trabajo social", "Enfermería", "Coaching"],

E:["Administración", "Marketing", "Negocios", "Derecho", "Emprendimiento"],

C:["Contabilidad", "Finanzas", "Administración pública", "Auditoría", "Gestión documental"]
};

const form = document.getElementById("vocationalForm");

questions.forEach((q,index)=>{

    const div = document.createElement("div");
    div.classList.add("question");

    div.innerHTML = `
        <h3>${index+1}. ${q.text}</h3>

        <div class="options">
            ${[1,2,3,4,5].map(val=>`
                <label>
                    <input type="radio" name="q${index}" value="${val}">
                    <span>${val} ${getLabel(val)}</span>
                </label>
            `).join("")}
        </div>
    `;

    form.appendChild(div);

});

function getLabel(v){

    switch(v){
        case 1:return "Nada";
        case 2:return "Poco";
        case 3:return "Moderado";
        case 4:return "Mucho";
        case 5:return "Totalmente";
    }

}

function calculateResults(){

    const scores = {
        R:0,
        I:0,
        A:0,
        S:0,
        E:0,
        C:0
    };

    for(let i=0;i<questions.length;i++){

        const answer = document.querySelector(`input[name="q${i}"]:checked`);

        if(!answer){
            alert("Por favor responde todas las preguntas.");
            return;
        }

        scores[questions[i].type] += parseInt(answer.value);

    }

    const sorted = Object.entries(scores)
        .sort((a,b)=>b[1]-a[1]);

    const hollandCode = sorted.slice(0,3).map(x=>x[0]).join("");

    const resultsDiv = document.getElementById("results");

    resultsDiv.style.display = "block";

    resultsDiv.innerHTML = `

        <h2>Resultados</h2>

        ${Object.entries(scores).map(([key,val])=>`

            <div class="score">

                <strong>${getDimensionName(key)} (${key})</strong>

                <div class="bar">
                    <div class="fill ${key}" style="width:${(val/20)*100}%"></div>
                </div>

                <small>${val} puntos</small>

            </div>

        `).join("")}

        <div class="result-box">

            <h2>Código Vocacional Holland: ${hollandCode}</h2>

            <p>
                Tus principales tendencias vocacionales indican afinidad hacia ambientes
                <strong>${getDimensionName(sorted[0][0])}</strong>,
                complementadas por características
                <strong>${getDimensionName(sorted[1][0])}</strong>
                y
                <strong>${getDimensionName(sorted[2][0])}</strong>.
            </p>

            <div class="careers">

                <h3>Interpretación principal</h3>

                <p>${descriptions[sorted[0][0]]}</p>

                <h3 style="margin-top:20px;">Áreas profesionales compatibles</h3>

                <ul>
                    ${careers[sorted[0][0]].map(c=>`<li>${c}</li>`).join("")}
                </ul>

            </div>

        </div>

    `;

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}

function getDimensionName(letter){

    return {
        R:"Realista",
        I:"Investigador",
        A:"Artístico",
        S:"Social",
        E:"Emprendedor",
        C:"Convencional"
    }[letter];

}

</script>

</body>
</html>
